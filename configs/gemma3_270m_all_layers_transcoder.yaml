# Gemma 3 270M Multi-Layer Skip-Transcoder (All 17 Depth Transitions Simultaneously)
model_name_or_path: "google/gemma-3-270m"
torch_dtype: "bfloat16"
load_in_4bit: false
context_length: 512
mask_bos: true
normalize_activations: true

# Source hook points (Input representations X_l)
hook_points:
  - "model.layers.0"
  - "model.layers.1"
  - "model.layers.2"
  - "model.layers.3"
  - "model.layers.4"
  - "model.layers.5"
  - "model.layers.6"
  - "model.layers.7"
  - "model.layers.8"
  - "model.layers.9"
  - "model.layers.10"
  - "model.layers.11"
  - "model.layers.12"
  - "model.layers.13"
  - "model.layers.14"
  - "model.layers.15"
  - "model.layers.16"

# Target hook points (Output representations Y_{l+1})
target_hook_points:
  - "model.layers.1"
  - "model.layers.2"
  - "model.layers.3"
  - "model.layers.4"
  - "model.layers.5"
  - "model.layers.6"
  - "model.layers.7"
  - "model.layers.8"
  - "model.layers.9"
  - "model.layers.10"
  - "model.layers.11"
  - "model.layers.12"
  - "model.layers.13"
  - "model.layers.14"
  - "model.layers.15"
  - "model.layers.16"
  - "model.layers.17"

architecture: "skip_transcoder"
expansion_factor: 8       # d_sae = 640 * 8 = 5,120 features per layer transition
k: 32                      # Top-32 active features per transition
aux_loss_coeff: 0.03125    # Auxiliary dead-latent loss

dataset_path: "HuggingFaceFW/fineweb-edu"
dataset_name: "sample-10BT"
dataset_split: "train"
batch_size: 4096
learning_rate: 0.0003
min_learning_rate: 0.00001
lr_warmup_steps: 1000
total_steps: 25000
checkpoint_steps: 2500
dead_feature_threshold: 1000000
use_ghost_grads: true
ghost_grad_coeff: 0.1
output_dir: "checkpoints/gemma3_270m_skip_transcoder_all_layers"
wandb_project: "gemma3-270m-transcoder"
seed: 42
