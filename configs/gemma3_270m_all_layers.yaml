# Gemma 3 270M Full Architecture SAE Training Config (All 18 Depth Layers Simultaneously)
model_name_or_path: "google/gemma-3-270m"
torch_dtype: "bfloat16"
load_in_4bit: false
context_length: 512
mask_bos: true
normalize_activations: true

# Train all 18 layers from a single forward pass through Gemma 3 270M
hook_points:
  - "model.layers.0"
  - "model.layers.1"
  - "model.layers.2"
  - "model.layers.3"
  - "model.layers.4"
  - "model.layers.5"
  - "model.layers.6"
  - "model.layers.7"
  - "model.layers.8"
  - "model.layers.9"
  - "model.layers.10"
  - "model.layers.11"
  - "model.layers.12"
  - "model.layers.13"
  - "model.layers.14"
  - "model.layers.15"
  - "model.layers.16"
  - "model.layers.17"

architecture: "spherical_tree_sasa"
expansion_factor: 4        # d_sae = 640 * 4 = 2,560 subspaces per layer
subspace_rank: 2           # 2D Stiefel Grassmannian Subspaces
num_coarse: 64             # 64 coarse parent concept centroids
k: 32                      # BatchTopK active subspaces per layer
k_coarse: 8                # Top-8 coarse parent routing
aux_loss_coeff: 0.03125    # Subspace Auxiliary Residual Loss for Dead Latents
coarse_loss_coeff: 0.25    # Coarse parent reconstruction loss
ortho_loss_coeff: 0.0001   # Subspace basis orthogonality regularizer

dataset_path: "HuggingFaceFW/fineweb-edu"
dataset_name: "sample-10BT"
dataset_split: "train"
batch_size: 4096
learning_rate: 0.0003
min_learning_rate: 0.00001
lr_warmup_steps: 1000
total_steps: 25000
checkpoint_steps: 2500
dead_feature_threshold: 1000000
use_ghost_grads: false     # Native Subspace Aux Loss handles anti-death
output_dir: "checkpoints/gemma3_270m_spherical_tree_sasa"
wandb_project: "gemma3-270m-sae"
seed: 42
