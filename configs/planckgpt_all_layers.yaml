# PlanckGPT Full Architecture SAE Training Config (All 14 Depth Layers Simultaneously)
model_name_or_path: "cattonpm/PlanckGPT-v0.10.0"
torch_dtype: "bfloat16"
context_length: 512
mask_bos: true
normalize_activations: true

# Train all 14 depth layers simultaneously from 1 LLM forward pass
hook_points:
  - "transformer.0"
  - "transformer.1"
  - "transformer.2"
  - "transformer.3"
  - "transformer.4"
  - "transformer.5"
  - "transformer.6"
  - "transformer.7"
  - "transformer.8"
  - "transformer.9"
  - "transformer.10"
  - "transformer.11"
  - "transformer.12"
  - "transformer.13"

architecture: "spherical_tree_sasa"
expansion_factor: 4        # d_sae = 896 * 4 = 3,584 subspaces per layer (3,584 x 2 = 7,168 basis directions)
subspace_rank: 2           # 2D Stiefel Grassmannian Subspaces
num_coarse: 64             # 64 coarse parent concept centroids
k: 32                      # BatchTopK active subspaces per layer
k_coarse: 8                # Top-8 coarse parent routing
aux_loss_coeff: 0.03125    # Subspace Auxiliary Residual Loss for Dead Latents
coarse_loss_coeff: 0.25    # Coarse parent reconstruction loss
ortho_loss_coeff: 0.0001   # Subspace basis orthogonality regularizer

dataset_path: "HuggingFaceFW/fineweb-edu"
dataset_name: "sample-10BT"
dataset_split: "train"
batch_size: 4096
learning_rate: 0.0003
min_learning_rate: 0.00001
lr_warmup_steps: 1000
total_steps: 25000
checkpoint_steps: 2500
dead_feature_threshold: 1000000
use_ghost_grads: false     # Native Subspace Aux Loss handles anti-death
output_dir: "checkpoints/planckgpt_spherical_tree_sasa"
wandb_project: "planckgpt-sae"
seed: 42
